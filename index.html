<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nandini Kalita | Data Scientist & AI/ML Engineer</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --card-border: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --tag-bg: rgba(56, 189, 248, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Header / Navbar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid var(--card-border);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 8%;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
            text-decoration: none;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav ul li a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav ul li a:hover {
            color: var(--accent-color);
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 2rem;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .hero h1 span {
            color: var(--accent-color);
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--accent-color);
            font-weight: 500;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.05rem;
            color: var(--text-secondary);
            max-width: 650px;
            margin-bottom: 2rem;
        }

        .social-btns {
            display: flex;
            gap: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #0b0f19;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-outline {
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            background: var(--card-bg);
        }

        .btn-outline:hover {
            border-color: var(--accent-color);
        }

        /* Sections */
        section {
            padding: 5rem 10% 3rem 10%;
            border-bottom: 1px solid var(--card-border);
        }

        section h2 {
            font-size: 2rem;
            margin-bottom: 2.5rem;
            text-align: center;
            font-weight: 700;
        }

        section h2 span {
            color: var(--accent-color);
        }

        /* About Section */
        .about-content {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.8;
        }

        /* Skills Section */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .skill-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1.8rem;
            border-radius: 12px;
        }

        .skill-card h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--accent-color);
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            background: var(--tag-bg);
            color: var(--accent-color);
            padding: 0.3rem 0.75rem;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 500;
        }

        /* Experience Grid (Card Layout Style) */
        .experience-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .exp-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.2s;
        }

        .exp-card:hover {
            border-color: var(--accent-color);
        }

        .exp-card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.25rem;
        }

        .exp-role {
            color: var(--accent-color);
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .exp-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .exp-card ul {
            list-style-type: disc;
            padding-left: 1.2rem;
            color: var(--text-secondary);
            font-size: 0.92rem;
        }

        .exp-card li {
            margin-bottom: 0.5rem;
        }

        /* Projects Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .project-card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.75rem;
        }

        .project-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        @media(max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            nav ul { display: none; }
        }
    </style>
</head>

            </ul>
        </nav>
